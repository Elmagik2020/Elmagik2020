name: Unzip upload
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q ./*.zip -d _tmp
          rm -rf _tmp/*/.github
          cp -a _tmp/*/. .
          rm -rf _tmp
          rm -f ./*.zip
          git config user.name "github-actions"
          git config user.email "github-actions@users.github.com"
          git add -A
          git commit -m "Update to v1.0.12"
          git push
